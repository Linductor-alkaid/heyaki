name: release-sdk

# Builds the per-platform client-library SDK archives (install tree with the
# static libraries, headers, and CMake packages) and attaches them to a
# GitHub release. Runs automatically when a release is published, or
# manually via workflow_dispatch for an already-published release (used for
# v1.0.0, which predates this workflow).
#
# The archives are CI-built; the offline-held Ed25519 release key never
# enters CI. Signing happens afterwards on the release host: the operator
# downloads the archives, extends the signed manifest, and uploads it (see
# docs/operations/release-signing.md and the release checklist).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the SDK archives for (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-sdk:
    # Built on the Ubuntu 20.04 baseline (glibc 2.31, GCC 11 from the
    # toolchain PPA) inside a container so the archives run on 20.04 and
    # every newer distribution. Executables statically link libstdc++ and
    # libgcc (they use std::atomic wait/notify, a libstdc++ 11 feature that
    # stock focal does not provide), so bin/ runs on a bare 20.04; the SDK
    # libraries themselves carry no runtime requirement beyond the
    # consumer's own toolchain. OpenSSL 3 (headers + runtime libs) is
    # bundled into the archive so consumers on distributions without an
    # OpenSSL 3 package (20.04 ships the 1.1 line) can configure against
    # the SDK itself via -DOPENSSL_ROOT_DIR=<sdk>.
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Etc/UTC
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "release tag must look like vX.Y.Z, got: $tag" >&2; exit 1 ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Local composite actions resolve from the workspace: checkout first.
      - name: Provision toolchain (g++-11, pinned CMake, OpenSSL 3.0.x)
        uses: ./.github/actions/ubuntu-2004-toolchain
      - name: Resolve the tag commit
        # github.sha is the dispatching commit, not the built tree; deref
        # the (annotated) tag through the API so the SDK stamps the commit
        # it was actually built from. Pure python3: the local composite
        # action resolves from the tag tree, whose package list may lag
        # master's (curl arrived after this release's tag).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(python3 - <<'PY'
          import json, os, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"]})
              return json.load(urllib.request.urlopen(req))
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          obj = get(f"https://api.github.com/repos/{repo}/git/ref/tags/{tag}")["object"]
          if obj["type"] == "tag":
              obj = get(obj["url"])["object"]
          print(obj["sha"])
          PY
          )
          echo "TAG_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "tag $TAG -> commit $commit"
      - name: Fetch pinned dependencies
        run: scripts/fetch_third_party.sh --all
      - name: Configure (Release, default juice backend)
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-11
          -DCMAKE_CXX_COMPILER=g++-11
          "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          "-DHEYAKI_BUILD_COMMIT=${{ env.TAG_COMMIT }}"
          -DHEYAKI_WARNINGS_AS_ERRORS=OFF
          -DHEYAKI_FETCH_DEPENDENCIES=OFF
          -DHEYAKI_AUTO_INSTALL=OFF
          -DOPENSSL_ROOT_DIR=/opt/openssl3
      - name: Build
        run: cmake --build build --parallel 2
      - name: Install and archive the SDK
        run: |
          root="heyaki-${VERSION}-linux-x86_64"
          cmake --install build --prefix "$PWD/$root"
          # Bundle OpenSSL 3 for OpenSSL-1.1 distributions (see job header).
          cp -a /opt/openssl3/include/openssl "$root/include/"
          cp -a /opt/openssl3/lib/libssl.so* /opt/openssl3/lib/libcrypto.so* "$root/lib/"
          # The install must report the same version as the release tag, and
          # must run using the SDK's own bundled OpenSSL (the installed
          # binaries carry no rpath) - proving the archive self-contained.
          LD_LIBRARY_PATH="$PWD/$root/lib" "./$root/bin/heyaki-relay" --version \
            | grep -F "heyaki-relay ${VERSION} "
          # Compatibility gate: nothing may reference symbol versions beyond
          # the 20.04 baseline (glibc 2.31; executables carry no GLIBCXX
          # references at all thanks to the static libstdc++ link).
          exceeds() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ] && [ "$1" != "$2" ]
          }
          versions=$(find "$root/bin" -type f -executable \
            -exec sh -c 'objdump -T "$1" 2>/dev/null' _ {} \; \
            | grep -oE 'GLIBCXX_[0-9.]+|GLIBC_[0-9.]+' | sort -Vu || true)
          max_glibc=$(printf '%s\n' "$versions" | grep '^GLIBC_' | sort -V | tail -1)
          max_glibcxx=$(printf '%s\n' "$versions" | grep '^GLIBCXX_' | sort -V | tail -1)
          echo "baseline symbols: ${max_glibc:-none} ${max_glibcxx:-none}"
          if { [ -n "$max_glibc" ] && exceeds "$max_glibc" "GLIBC_2.31"; } || \
             { [ -n "$max_glibcxx" ] && exceeds "$max_glibcxx" "GLIBCXX_3.4.28"; }; then
            echo "symbol versions above the Ubuntu 20.04 baseline:" >&2
            echo "$versions" >&2
            exit 1
          fi
          tar -czf "${root}-sdk.tar.gz" "$root"
          sha256sum "${root}-sdk.tar.gz"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The ubuntu:20.04 container image has no gh CLI; upload through
          # the REST API directly. Provision the tools HERE: local composite
          # actions resolve from the checked-out tag tree, which may lag the
          # provisioning package list on master.
          apt-get update && apt-get install -y --no-install-recommends curl python3
          release_id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$TAG"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for asset in heyaki-*-sdk.tar.gz; do
            curl -fsSL -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Content-Type: application/octet-stream"               --data-binary "@$asset"               "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?name=$asset"
            echo "uploaded: $asset"
          done

  windows-sdk:
    runs-on: windows-2025
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "release tag must look like vX.Y.Z, got: $tag" >&2; exit 1 ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Fetch pinned dependencies
        shell: bash
        run: scripts/fetch_third_party.sh --all
      - name: Configure (Release, default juice backend)
        shell: pwsh
        run: |
          $opensslRoot = "${env:ProgramFiles}/OpenSSL"
          if (-not (Test-Path "$opensslRoot/include/openssl/ssl.h")) {
            throw "GitHub runner OpenSSL development files not found at $opensslRoot"
          }
          cmake -S . -B build -A x64 `
            -DHEYAKI_WARNINGS_AS_ERRORS=ON `
            -DHEYAKI_FETCH_DEPENDENCIES=OFF `
            -DHEYAKI_AUTO_INSTALL=OFF `
            "-DOPENSSL_ROOT_DIR=$opensslRoot"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Install and archive the SDK
        shell: pwsh
        run: |
          $root = "heyaki-${env:VERSION}-windows-x64"
          cmake --install build --config Release --prefix "$PWD/$root"
          # The install must report the same version as the release tag.
          $versionLine = & "$root/bin/heyaki-relay.exe" --version | Select-Object -First 1
          if (-not $versionLine.Contains("heyaki-relay ${env:VERSION} ")) {
            throw "installed version does not match the release tag: $versionLine"
          }
          # The SDK's only dynamic third-party runtime besides the MSVC
          # runtime is OpenSSL; bundle the DLLs next to the apps so the tree
          # runs as extracted (datachannel.dll is already installed by the
          # pinned dependency's own install rules).
          $opensslRoot = "${env:ProgramFiles}/OpenSSL"
          foreach ($dll in @("libssl-3-x64.dll", "libcrypto-3-x64.dll")) {
            $source = Join-Path $opensslRoot "bin/$dll"
            if (Test-Path $source) {
              Copy-Item $source "$root/bin/$dll"
            } else {
              throw "OpenSSL runtime DLL not found: $source"
            }
          }
          Compress-Archive -Path "$root" -DestinationPath "${root}-sdk.zip"
          Get-FileHash "${root}-sdk.zip" -Algorithm SHA256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:TAG" "heyaki-$($env:VERSION)-windows-x64-sdk.zip" --clobber
