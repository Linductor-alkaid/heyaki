syntax = "proto3";

package heyaki.protocol.enrollment.v1;

option optimize_for = LITE_RUNTIME;

import "heyaki/common/v1/common.proto";

message EnrollmentChallenge {
  bytes relay_id = 1;
  bytes nonce = 2; // Exactly 32 random bytes.
  uint64 expires_unix_milliseconds = 3;
}

message EnrollmentRequest {
  heyaki.protocol.common.v1.DeviceEndpoint endpoint = 1;
  bytes identity_public_key = 2; // Exactly 32 Ed25519 bytes.
  bytes challenge_nonce = 3;
  string tenant = 4;
  string bootstrap_token = 5; // Secret: never log or include in the signature object.
  heyaki.protocol.common.v1.ProtocolVersion protocol_version = 6;
  heyaki.protocol.common.v1.CapabilityAdvertisement capabilities = 7;
  uint64 expires_unix_milliseconds = 8;
  heyaki.protocol.common.v1.Signature signature = 9;
}

message EnrollmentResult {
  string tenant = 1;
  uint64 enrollment_generation = 2;
  uint64 token_remaining_uses_after = 3;
}

message ControlError {
  heyaki.protocol.common.v1.ErrorCode error_code = 1;
  string safe_detail = 2;
}

message EnrollmentRecord {
  heyaki.protocol.common.v1.DeviceEndpoint endpoint = 1;
  bytes relay_id = 2;
  string tenant = 3;
  uint64 enrollment_generation = 4;
  uint64 issued_unix_milliseconds = 5;
  heyaki.protocol.common.v1.Signature relay_signature = 6;
}

message EndpointRecord {
  heyaki.protocol.common.v1.DeviceEndpoint endpoint = 1;
  string application_id = 2;
  uint64 record_generation = 3;
  bytes manifest_sha256 = 4;
  uint64 expires_unix_milliseconds = 5;
  heyaki.protocol.common.v1.Signature signature = 6;
}

message ServiceManifest {
  heyaki.protocol.common.v1.DeviceEndpoint endpoint = 1;
  uint64 manifest_generation = 2;
  bytes canonical_manifest_sha256 = 3;
  uint64 expires_unix_milliseconds = 4;
  heyaki.protocol.common.v1.Signature signature = 5;
}
