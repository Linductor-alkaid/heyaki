syntax = "proto3";

package heyaki.protocol.signaling.v1;

option optimize_for = LITE_RUNTIME;

import "heyaki/common/v1/common.proto";

message SignalBinding {
  heyaki.protocol.common.v1.DeviceEndpoint initiator = 1;
  heyaki.protocol.common.v1.DeviceEndpoint responder = 2;
  bytes request_id = 3; // Exactly 16 bytes.
  bytes session_id = 4; // Exactly 16 bytes.
  bytes initiator_nonce = 5;
  uint64 expires_unix_milliseconds = 6;
  optional bytes responder_nonce = 7;
}

message SignedOffer {
  SignalBinding binding = 1;
  bytes sdp = 2;
  bytes dtls_fingerprint = 3;
  heyaki.protocol.common.v1.Signature signature = 4;
}

message SignedAnswer {
  SignalBinding binding = 1;
  bytes sdp = 2;
  bytes dtls_fingerprint = 3;
  heyaki.protocol.common.v1.Signature signature = 4;
}

message SignedCandidate {
  SignalBinding binding = 1;
  uint32 sequence = 2;
  bytes candidate = 3;
  bytes signaling_transcript_sha256 = 4; // Exactly 32 bytes over canonical offer + answer.
  string owner_ice_ufrag = 5;
  bytes owner_dtls_fingerprint = 6; // Exactly 32 raw SHA-256 fingerprint bytes.
  heyaki.protocol.common.v1.Signature signature = 7;
}
