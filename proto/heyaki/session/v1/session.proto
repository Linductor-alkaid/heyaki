syntax = "proto3";

package heyaki.protocol.session.v1;

option optimize_for = LITE_RUNTIME;

import "heyaki/common/v1/common.proto";

message SessionHello {
  heyaki.protocol.common.v1.DeviceEndpoint sender = 1;
  heyaki.protocol.common.v1.DeviceEndpoint peer = 2;
  bytes session_id = 3;
  uint64 session_epoch = 4;
  bytes initiator_nonce = 5;
  bytes responder_nonce = 6;
  bytes dtls_channel_binding = 7;
  heyaki.protocol.common.v1.ProtocolVersion protocol_version = 8;
  heyaki.protocol.common.v1.CapabilityAdvertisement capabilities = 9;
  uint64 expires_unix_milliseconds = 10;
  heyaki.protocol.common.v1.Signature signature = 11;
}

message SessionClose {
  heyaki.protocol.common.v1.StableStatusCode status = 1;
  string safe_detail = 2;
}
