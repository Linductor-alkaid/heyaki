name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: scripts/fetch_third_party.sh --all
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          -DHEYAKI_BUILD_FUZZERS=${{ matrix.compiler == 'clang' && matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
          -DHEYAKI_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Configure pinned libdatachannel baseline
        run: >-
          cmake -S third_party/libdatachannel -B build-libdatachannel
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          -DCMAKE_SKIP_INSTALL_RULES=ON
          -DBUILD_SHARED_LIBS=OFF
          -DNO_EXAMPLES=ON
          -DNO_TESTS=ON
          -DNO_MEDIA=ON
          -DNO_WEBSOCKET=ON
          -DUSE_NICE=OFF
          -DUSE_GNUTLS=OFF
          -DUSE_MBEDTLS=OFF
          -DWARNINGS_AS_ERRORS=ON
          -DRTC_UPDATE_VERSION_HEADER=OFF
      - name: Build pinned libdatachannel baseline
        run: cmake --build build-libdatachannel --target datachannel-static --parallel 2
      - name: Test
        env:
          HEYAKI_REQUIRE_NETWORK_HARNESS: "1"
          HEYAKI_M3A_STRESS_CYCLES: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Debug' && '64' || '8' }}
          HEYAKI_M3A_STRESS_EPOCHS: ${{ matrix.compiler == 'gcc' && matrix.build_type == 'Debug' && '3' || '2' }}
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Run protocol libFuzzer targets
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug'
        run: |
          build/tests/heyaki_frame_parser_fuzzer -runs=100 build/fuzz-corpus/frame-parser
          build/tests/heyaki_protocol_state_fuzzer -runs=100 build/fuzz-corpus/protocol-state
          build/tests/heyaki_protobuf_parser_fuzzer -runs=100 build/fuzz-corpus/protobuf-parser
          build/tests/heyaki_lan_state_fuzzer -runs=100 build/fuzz-corpus/lan-directory-state
      - name: Verify all dependency groups offline
        run: scripts/fetch_third_party.sh --check --all

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        shell: bash
        run: scripts/fetch_third_party.sh --all
      - name: Configure
        shell: pwsh
        run: |
          $opensslRoot = "${env:ProgramFiles}/OpenSSL"
          if (-not (Test-Path "$opensslRoot/include/openssl/ssl.h")) {
            throw "GitHub runner OpenSSL development files not found at $opensslRoot"
          }
          cmake -S . -B build -A x64 `
            -DHEYAKI_WARNINGS_AS_ERRORS=ON `
            "-DOPENSSL_ROOT_DIR=$opensslRoot"
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2
      - name: Configure pinned libdatachannel baseline
        shell: pwsh
        run: |
          $opensslRoot = "${env:ProgramFiles}/OpenSSL"
          if (-not (Test-Path "$opensslRoot/include/openssl/ssl.h")) {
            throw "GitHub runner OpenSSL development files not found at $opensslRoot"
          }
          cmake -S third_party/libdatachannel -B build-libdatachannel -A x64 `
            -DCMAKE_SKIP_INSTALL_RULES=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DNO_EXAMPLES=ON `
            -DNO_TESTS=ON `
            -DNO_MEDIA=ON `
            -DNO_WEBSOCKET=ON `
            -DUSE_NICE=OFF `
            -DUSE_GNUTLS=OFF `
            -DUSE_MBEDTLS=OFF `
            -DWARNINGS_AS_ERRORS=ON `
            -DRTC_UPDATE_VERSION_HEADER=OFF `
            "-DOPENSSL_ROOT_DIR=$opensslRoot"
      - name: Build pinned libdatachannel baseline
        run: cmake --build build-libdatachannel --target datachannel-static --config Release --parallel 2
      - name: Test
        env:
          HEYAKI_REQUIRE_LAN_INTERFACES: "1"
          HEYAKI_REQUIRE_WINDOWS_FIREWALL_HARNESS: "1"
          HEYAKI_M3A_STRESS_CYCLES: "16"
          HEYAKI_M3A_STRESS_EPOCHS: "2"
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error

  coturn-topology:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: scripts/fetch_third_party.sh --all
      - name: Configure relay
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHEYAKI_BUILD_APPS=ON
          -DHEYAKI_WARNINGS_AS_ERRORS=ON
      - name: Build relay
        run: cmake --build build --target heyaki-relay --parallel 2
      - name: Install coturn fallback package
        timeout-minutes: 10
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y coturn
          sudo systemctl stop coturn || true
          sudo pkill -TERM turnserver || true
          sleep 1
          sudo pkill -KILL turnserver || true
      - name: Run isolated two-client coturn topology
        run: >-
          sudo deploy/coturn/run_topology.sh
          --relay-bin "$PWD/build/heyaki-relay"

  sanitizer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        run: scripts/fetch_third_party.sh --all
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DHEYAKI_REQUIRE_SANITIZER_RUNTIME=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        env:
          HEYAKI_REQUIRE_LAN_INTERFACES: "1"
          HEYAKI_M3A_STRESS_CYCLES: "32"
          HEYAKI_M3A_STRESS_EPOCHS: "3"
        run: ctest --preset ${{ matrix.preset }}
      - name: Fuzz smoke
        run: cmake --build build/${{ matrix.preset }} --target heyaki-fuzz-smoke
