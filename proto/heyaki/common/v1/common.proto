syntax = "proto3";

package heyaki.protocol.common.v1;

option optimize_for = LITE_RUNTIME;

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message CapabilityAdvertisement {
  uint64 supported_bits = 1;
  uint64 required_bits = 2;
}

message DeviceEndpoint {
  bytes device_id = 1;   // Exactly 32 bytes.
  bytes endpoint_id = 2; // Exactly 16 bytes.
}

message Signature {
  bytes ed25519 = 1; // Exactly 64 bytes over the canonical signing object.
}

message RelativeDeadline {
  uint32 remaining_milliseconds = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_CONFIGURATION = 1;
  ERROR_CODE_IDENTITY = 2;
  ERROR_CODE_AUTHENTICATION = 3;
  ERROR_CODE_PERMISSION = 4;
  ERROR_CODE_NOT_REGISTERED = 5;
  ERROR_CODE_ENROLLMENT_REVOKED = 6;
  ERROR_CODE_PROFILE_LOCKED = 7;
  ERROR_CODE_PAIRING_REQUIRED = 8;
  ERROR_CODE_PAIRING_DENIED = 9;
  ERROR_CODE_PAIRING_RATE_LIMITED = 10;
  ERROR_CODE_PEER_OFFLINE = 11;
  ERROR_CODE_ENDPOINT_OFFLINE = 12;
  ERROR_CODE_SIGNALING = 13;
  ERROR_CODE_NAT_TRAVERSAL = 14;
  ERROR_CODE_RELAY_UNAVAILABLE = 15;
  ERROR_CODE_TRANSPORT = 16;
  ERROR_CODE_PROTOCOL = 17;
  ERROR_CODE_TIMEOUT = 18;
  ERROR_CODE_CANCELLED = 19;
  ERROR_CODE_WOULD_BLOCK = 20;
  ERROR_CODE_RESOURCE_EXHAUSTED = 21;
  ERROR_CODE_REMOTE_ERROR = 22;
  ERROR_CODE_OUTCOME_UNKNOWN = 23;
  ERROR_CODE_INTERNAL = 24;
  ERROR_CODE_SECRET_UNAVAILABLE = 25;
  ERROR_CODE_SECRET_BACKEND_DEGRADED = 26;
  ERROR_CODE_PROFILE_PERMISSIONS = 27;
  ERROR_CODE_PROFILE_CORRUPT = 28;
  ERROR_CODE_SCHEMA_TOO_NEW = 29;
  ERROR_CODE_STORAGE = 30;
}

enum StableStatusCode {
  STABLE_STATUS_CODE_UNSPECIFIED = 0;
  STABLE_STATUS_CODE_OK = 1;
  STABLE_STATUS_CODE_CANCELLED = 2;
  STABLE_STATUS_CODE_DEADLINE_EXCEEDED = 3;
  STABLE_STATUS_CODE_UNAUTHENTICATED = 4;
  STABLE_STATUS_CODE_PERMISSION_DENIED = 5;
  STABLE_STATUS_CODE_NOT_FOUND = 6;
  STABLE_STATUS_CODE_ALREADY_EXISTS = 7;
  STABLE_STATUS_CODE_RESOURCE_EXHAUSTED = 8;
  STABLE_STATUS_CODE_FAILED_PRECONDITION = 9;
  STABLE_STATUS_CODE_UNAVAILABLE = 10;
  STABLE_STATUS_CODE_INTERNAL = 11;
  STABLE_STATUS_CODE_UNIMPLEMENTED = 12;
  STABLE_STATUS_CODE_PROTOCOL_ERROR = 13;
  STABLE_STATUS_CODE_OUTCOME_UNKNOWN = 14;
}
