# Heyaki coturn baseline. The secret is injected by the deployment environment.
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350
realm=heyaki.invalid
server-name=heyaki-relay-turn
use-auth-secret
static-auth-secret=__TURN_SECRET__
stale-nonce=600
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
cert=/etc/letsencrypt/live/heyaki.invalid/fullchain.pem
pkey=/etc/letsencrypt/live/heyaki.invalid/privkey.pem
min-port=49160
max-port=49200
total-quota=100
user-quota=12
mobility
no-stdout-log
log-file=/var/log/coturn/turnserver.log
